<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart – Arivon Apparel</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .cart-page-wrap {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 61px);
    }

    .cart-page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid #333;
      letter-spacing: 2px;
      font-size: 13px;
    }

    .cart-page-items {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .cart-page-items::-webkit-scrollbar { width: 4px; }
    .cart-page-items::-webkit-scrollbar-track { background: #111; }
    .cart-page-items::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

    .cart-page-footer {
      border-top: 1px solid #333;
      padding: 24px 40px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 500px;
    }

    .cart-page-total {
      font-size: 16px;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .cart-checkout-btn {
      padding: 16px;
      background: white;
      color: black;
      border: none;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }

    .cart-checkout-btn:hover {
      background: #ddd;
      transform: scale(1.02);
    }

    .cart-item {
      padding: 14px 40px;
    }

    .cart-empty {
      text-align: center;
      color: #666;
      margin-top: 80px;
      font-size: 13px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <h2 class="logo">ARIVON APPAREL</h2>
    <nav>
      <a href="index.html">← Back to Shop</a>
    </nav>
  </header>

  <div class="cart-page-wrap">

    <div class="cart-page-header">
      <span>YOUR CART</span>
    </div>

    <div class="cart-page-items" id="cartContainer"></div>

    <div class="cart-page-footer">
      <div class="cart-page-total" id="cartTotal">Total: $0</div>
      <button class="cart-checkout-btn" onclick="buyNowCart()">CHECKOUT →</button>
    </div>

  </div>

  <script src="script.js"></script>
  <script>
    renderCartPage();
  </script>

</body>
</html>
