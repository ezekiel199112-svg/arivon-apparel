<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Washed Hoodie</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <h2 class="logo">ARIVON APPAREL</h2>
    <nav>
      <a href="index.html">Back to Shop</a>
      <a href="about.html">About</a>
      <a href="#" onclick="openCart(); return false;" style="display:flex;align-items:center;gap:6px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span id="cart-count" class="cart-count"></span>
      </a>
    </nav>
  </header>

  <section class="product-page">

    <div class="product-gallery">
      <div class="thumbnails">
        <img src="images/Screenshot 2026-06-06 130025.png" class="thumb active" onclick="switchImage(this)">
        <img src="images/Screenshot 2026-06-06 150510.png" class="thumb" onclick="switchImage(this)">
      </div>
      <img id="main-img" src="images/Screenshot 2026-06-06 130025.png" class="product-main-img">
    </div>

    <div class="product-info">
      <h1 id="product-name">Washed Hoodie</h1>
      <p>$55</p>
      <p>Heavyweight washed hoodie made for everyday wear.</p>

      <div class="sizes">
        <button class="size-btn" onclick="selectSize('S', this)">S</button>
        <button class="size-btn" onclick="selectSize('M', this)">M</button>
        <button class="size-btn" onclick="selectSize('L', this)">L</button>
        <button class="size-btn" onclick="selectSize('XL', this)">XL</button>
      </div>

      <button id="buyBtn" onclick="buyNow()" disabled>Buy Now</button>
<button id="buyNowStripe" onclick="stripeCheckoutNow()" disabled>Buy Now</button>
    </div>

  </section>

  <!-- CART OVERLAY -->
  <div id="cart-overlay" class="cart-overlay" onclick="closeCart()"></div>

  <!-- SLIDE-IN CART PANEL -->
  <div id="cart-panel" class="cart-panel">

    <div class="cart-panel-header">
      <span>YOUR CART</span>
      <div class="cart-header-actions">
        <button class="cart-icon-btn" onclick="toggleFullscreen()" id="fullscreen-btn">⛶</button>
        <button class="cart-icon-btn" onclick="closeCart()">✕</button>
      </div>
    </div>

    <div id="cart-panel-items" class="cart-panel-items"></div>

    <div class="cart-panel-footer">
      <div class="cart-panel-total" id="cart-panel-total">Total: $0</div>
      <button class="cart-checkout-btn" onclick="buySelected()">CHECKOUT →</button>
      <a href="cart.html" class="cart-view-full">View full cart page</a>
    </div>

  </div>

  <script src="script.js"></script>
  <script>
    function switchImage(thumb) {
      document.getElementById('main-img').src = thumb.src;
      document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
      thumb.classList.add('active');
    }

    function openCart() {
      renderCartPanel();
      document.getElementById('cart-panel').classList.add('open');
      document.getElementById('cart-overlay').classList.add('active');
    }

    function closeCart() {
      document.getElementById('cart-panel').classList.remove('open', 'fullscreen');
      document.getElementById('cart-overlay').classList.remove('active');
      document.getElementById('fullscreen-btn').textContent = '⛶';
    }

    function toggleFullscreen() {
      const panel = document.getElementById('cart-panel');
      const btn = document.getElementById('fullscreen-btn');
      const isFs = panel.classList.toggle('fullscreen');
      btn.textContent = isFs ? '⊡' : '⛶';
    }

    function renderCartPanel() {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      let items = document.getElementById('cart-panel-items');
      let totalEl = document.getElementById('cart-panel-total');
      let countEl = document.getElementById('cart-count');

      items.innerHTML = '';
      let total = 0;

      if (cart.length === 0) {
        items.innerHTML = '<p class="cart-empty">Your cart is empty.</p>';
        totalEl.textContent = 'Total: $0';
        if (countEl) countEl.textContent = '';
        return;
      }

      cart.forEach(item => {
        if (item.selected) total += item.price;
        items.innerHTML += `
          <div class="cart-item">
            <div class="select-btn ${item.selected ? 'selected' : ''}"
                 onclick="toggleSelect(${item.id}); renderCartPanel();"></div>
            <div class="item-info">
              <p class="item-name"><strong>${item.name}</strong></p>
              <p style="margin:0;font-size:12px;color:#aaa;">Size ${item.size}</p>
            </div>
            <div class="right-side">
              <span class="price">$${item.price}</span>
              <span class="remove-x" onclick="removeFromCart(${item.id}); renderCartPanel();">✕</span>
            </div>
          </div>`;
      });

      totalEl.textContent = 'Total: $' + total;
      if (countEl) countEl.textContent = cart.length > 0 ? `(${cart.length})` : '';
    }

    window.addEventListener('DOMContentLoaded', () => {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      let countEl = document.getElementById('cart-count');
      if (countEl && cart.length > 0) countEl.textContent = `(${cart.length})`;
    });
    async function stripeCheckoutNow() {
  if (!selectedSize) return;
  const name  = document.getElementById('product-name').innerText;
  const price = parseInt(document.querySelector('.product-info p').innerText.replace('$', ''));

  const res = await fetch('/.netlify/functions/create-checkout', {
    method: 'POST',
    body: JSON.stringify({ items: [{ name, price, size: selectedSize }] })
  });

  const { url } = await res.json();
  window.location.href = url;
}

  </script>

</body>
</html>
